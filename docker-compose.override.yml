# Локальная разработка. Подхватывается автоматически при `docker compose up`
# (на проде запускать с `-f docker-compose.yml` без этого файла).
#
# Даёт автосборку: код смонтирован томом, `node --watch` перезапускает приложение
# при любой правке в src/ — пересобирать образ не нужно.

services:
  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: "true"
    # Панель доступна с хоста на http://localhost:3000 (см. комментарий в базовом файле)
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
      - media:/app/media
    # node_modules берём из образа, чтобы монтирование не затирало их

  postgres:
    # Порт наружу — чтобы можно было подключиться psql/DBeaver с хоста
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5433}:5432"
