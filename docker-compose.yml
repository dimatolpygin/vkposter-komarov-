# Боевое описание стека на общем сервере okhost (навык /okdeploy2).
#
# Это файл, который запускается НА СЕРВЕРЕ просто `docker compose up -d --build`,
# без дополнительных `-f`. Поэтому в нём не должно быть ничего «локального»:
# именно его подхватывает `okhost rebuild`.
#
# Локальная разработка — вторым файлом, он не подхватывается автоматически:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Правила общего сервера, которые здесь соблюдены (нарушение ломает соседей):
#  * своего Postgres и Redis у проекта нет — они общие, реквизиты приходят
#    из .env.infra, который генерит `okhost new` и в git не попадает;
#  * никаких `ports:` — docker пробивает UFW насквозь, опубликованный порт окажется
#    в интернете в обход фаервола. Наружу ходит только общий Caddy;
#  * `mem_limit` обязателен: без потолка потёкший проект вызовет OOM-killer,
#    и убьёт тот не обязательно виновного, а хоть общий Postgres;
#  * имя контейнера строго `<проект>-app` — на него ссылается конфиг Caddy,
#    который пишет `okhost web`.
name: komarov-vkposter

services:
  app:
    build:
      context: .
      target: prod
    container_name: komarov-vkposter-app
    restart: unless-stopped
    # Порядок важен: .env.infra кладётся первым, .env вторым — значения проекта
    # перекрывают серверные, а не наоборот. POSTGRES_* приходят из .env.infra,
    # поэтому в .env их быть не должно.
    env_file:
      - .env.infra
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Короткий хеш выкаченного коммита. Виден в подвале панели — по нему на глаз
      # проверяется, что автодеплой действительно доехал.
      APP_REVISION: ${APP_REVISION:-}
      TZ: Europe/Moscow
    networks:
      # data — доступ к общим Postgres/Redis, internal, интернета в ней нет
      - data
      # edge — по ней Caddy ходит в контейнер за HTTP
      - edge
    mem_limit: 512m
    cpus: 1.0
    volumes:
      # Обложки постов должны переживать пересборку образа: их по публичной ссылке
      # скачивает postmypost, и ссылка не должна протухать после каждого выката.
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  data:
    external: true
  edge:
    external: true

volumes:
  media:
