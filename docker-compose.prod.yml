# Продовый слой поверх docker-compose.yml. Запускать ЯВНО обоими файлами:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Без `-f` docker подхватит docker-compose.override.yml (dev: монтирование кода,
# nodemon, порт Postgres наружу) — на проде это и лишнее, и небезопасно.
#
# Что добавляет этот файл:
#  * Caddy на 80/443 — reverse proxy и автоматический сертификат Let's Encrypt;
#  * приложение больше не торчит в интернет: порт 3000 слушается только на 127.0.0.1
#    (для curl с самого сервера), снаружи всё идёт через Caddy;
#  * ограничение логов docker — на диске 2 ГБ ОЗУ / малом VPS json-file без лимита
#    съедает раздел за недели.

services:
  app:
    environment:
      NODE_ENV: production
      LOG_PRETTY: ${LOG_PRETTY:-false}
      # Короткий хеш выкаченного коммита. Виден в подвале панели — по нему на глаз
      # проверяется, что автодеплой действительно доехал.
      APP_REVISION: ${APP_REVISION:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    logging: &journal
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    logging: *journal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Домен подставляется в Caddyfile. Пустое значение = Caddy слушает :80 без TLS,
      # поэтому DOMAIN в .env на проде обязателен.
      DOMAIN: ${DOMAIN}
      TZ: Europe/Moscow
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Здесь лежат выданные сертификаты. Без тома Let's Encrypt перевыпускается при
      # каждом пересоздании контейнера и упирается в недельный лимит на домен.
      - caddy_data:/data
      - caddy_config:/config
    logging: *journal

volumes:
  caddy_data:
  caddy_config:
